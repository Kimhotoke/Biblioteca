<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practica Uno</title>
    <link rel="stylesheet" href="css/signos-vitales.css">
</head>
<body>

    <div class="grid">
        <header class="header">
            <div class="tarjeta-header">
                <h1>Paciente</h1>
                <p>Nombre: Kamilo Octavio</p>
            </div>
            <div class="tarjeta-header">
                <h1>Area</h1>
                <p>Cuidados Intensivos UCI</p>
            </div>
            <div class="tarjeta-header">
                <h1>Camilla</h1>
                <p>Cama 04 pasillo 3B</p>
            </div>
            <div class="tarjeta-header">
                <h1>Electrocardiograma</h1>
            </div>
        </header>
            
        <aside class="aside">
            <div class="tarjeta-aside">
                <span class="etiqueta">Oxígeno SpO2</span>
                <div class="valor">98<span class="unidad">%</span></div>
            </div>
            <div class="tarjeta-aside">
                <span class="etiqueta">Presión Arterial</span>
                <div class="valor">118/75<span class="unidad">mmHG</span></div>
            </div>
            <div class="tarjeta-aside">
                <span class="etiqueta">Temperatura</span>
                <div class="valor">36.7<span class="unidad">°C</span></div>
            </div>
            <div class="tarjeta-aside">
                <span class="etiqueta">Infusión</span>
                <div class="valor">20<span class="unidad">mL/h</span></div>
            </div>
        </aside>

        <main class="main">

            <article class="monitor-grid">
                <img src="imagenes/electrocardiograma.png">
            </article>

        </main>

        <footer class="footer">
            <div class="tarjeta-footer">
                <button type="button" class="boton-footer">Reboot</button>
            </div>
            <div class="tarjeta-footer">
                <button type="button" class="boton-footer">Pacientes</button>
            </div>
            <div class="tarjeta-footer">
                <button type="button" class="boton-footer">Conexión</button>
            </div>
            <div class="tarjeta-footer">
                <button type="button" class="boton-footer">Configuración</button>
            </div>
            <div class="tarjeta-footer">
                <button type="button" class="boton-footer">Menu</button>
            </div>
            <div class="tarjeta-footer">
                <button type="button" class="boton-footer">Apagado</button>
            </div>
        </footer>
    </div>

</body>
</html>
