<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query Basica</title>
    <style>
        .menu {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #0f172a;
            padding: 16px;
        }
        .menu a {
            color: #fff;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 2rem;
        }

        /* Regla para Móviles */

        @media (max-width: 768px) {
            .menu {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
        }

    </style>
</head>
<body>

    <nav class="menu">
        <a href="#">Inicio</a> 
        <a href="#">Muestras</a> 
        <a href="#">Reportes</a> 
        <a href="#">Contacto</a> 
    </nav>
    
</body>
</html>
